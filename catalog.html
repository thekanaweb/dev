<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KanaWeb - Portfolio</title>

<style>
:root {
  --bg: #f5f7f6;
  --text: #2c2c2c;
  --green: #7a8f6a;
  --green-dark: #5f7454;
}

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: 'Segoe UI', sans-serif;
}

html, body {
  overflow-x: hidden;
}

body {
  background: var(--bg);
  color: var(--text);
  padding-top: 80px;
}

body.menu-open {
  overflow: hidden;
}

/* NAV */
.nav {
  display: flex;
  justify-content: space-between;
  padding: 20px 60px;
  align-items: center;
  position: fixed;
  top: 0;
  width: 100%;
  background: var(--bg);
  z-index: 1000;
}

.nav h1 span {
  color: var(--green);
}

.nav-links {
  display: flex;
  gap: 20px;
}

.nav a {
  text-decoration: none;
  color: var(--text);
}

/* BURGER */
.burger {
  display: none;
  flex-direction: column;
  cursor: pointer;
}

.burger div {
  width: 25px;
  height: 3px;
  background: var(--text);
  margin: 4px;
}

/* OVERLAY */
.overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.3);
  opacity: 0;
  pointer-events: none;
  transition: 0.3s;
  z-index: 998;
}

.overlay.active {
  opacity: 1;
  pointer-events: all;
}

/* PORTFOLIO */
.portfolio {
  padding: 80px 60px;
}

.portfolio h2 {
  font-size: 40px;
  margin-bottom: 10px;
}

.portfolio p {
  margin-bottom: 40px;
  color: #666;
}

/* GRID */
.grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 25px;
}

/* CARD */
.project {
  background: white;
  border-radius: 16px;
  overflow: hidden;
  box-shadow: 0 10px 30px rgba(0,0,0,0.05);
  transition: 0.3s;
}

.project:hover {
  transform: translateY(-6px);
}

.project img {
  width: 100%;
  height: 180px;
  object-fit: cover;
}

.project-content {
  padding: 20px;
}

.project-content h4 {
  margin-bottom: 8px;
}

.project-content p {
  font-size: 14px;
  color: #777;
  margin-bottom: 15px;
}

/* BUTTON */
.project-buttons {
  display: flex;
  gap: 10px;
}

.btn-demo {
  flex: 1;
  padding: 10px;
  text-align: center;
  border-radius: 8px;
  border: 1px solid var(--green);
  color: var(--green);
  text-decoration: none;
  font-size: 14px;
  transition: 0.2s;
}

.btn-demo:hover {
  background: var(--green);
  color: white;
}

.btn-buy {
  flex: 1;
  padding: 10px;
  text-align: center;
  border-radius: 8px;
  background: var(--green);
  color: white;
  text-decoration: none;
  font-size: 14px;
  transition: 0.2s;
}

.btn-buy:hover {
  background: var(--green-dark);
}

/* RESPONSIVE */
@media(max-width:1024px){
  .grid {
    grid-template-columns: repeat(2, 1fr);
  }
}

@media(max-width:768px){

  .nav {
    padding: 20px;
  }

  .burger {
    display: flex;
  }

  .nav-links {
    position: fixed;
    top: 0;
    right: 0;
    width: 240px;
    height: 100vh;
    background: white;

    flex-direction: column;
    justify-content: center;
    align-items: center;
    gap: 25px;

    transform: translateX(100%);
    transition: 0.3s;

    z-index: 999;
  }

  .nav-links.active {
    transform: translateX(0);
  }

  .portfolio {
    padding: 60px 20px;
  }

  .grid {
    grid-template-columns: 1fr;
  }
}
</style>
</head>

<body>

<div class="overlay" id="overlay"></div>

<!-- NAV -->
<div class="nav">
  <h1>Kana<span>Web</span></h1>

  <div class="nav-links" id="navLinks">
    <a href="index.html">Home</a>
    <a href="catalog.html">Catalog</a>
    <a href="index.html#pricing">Pricing</a>
    <a href="index.html#contact">Contact</a>
  </div>

  <div class="burger" id="burger">
    <div></div>
    <div></div>
    <div></div>
  </div>
</div>

<!-- CONTENT -->
<section class="portfolio">
  <h2>Catalog Website</h2>
  <p>Pilih desain dan langsung coba demo atau pesan</p>

  <div class="grid" id="catalogContainer"></div>
</section>

<script>
const API_URL = "https://opensheet.elk.sh/19DTiinTGYZ68Cr3cZ0CKQrFwuAs60ugvF7Tlf8xZjZ4/Sheet1";

fetch(API_URL)
.then(res => res.json())
.then(data => {

  const container = document.getElementById("catalogContainer");

  data.forEach(item => {

    if(item.display !== "1") return;

    const waLink = `https://wa.me/${item.wa_number}?text=${encodeURIComponent(item.wa_text)}`;

    const card = `
      <div class="project">
        <img src="${item.image}">
        <div class="project-content">
          <h4>${item.title}</h4>
          <p>${item.desc}</p>

          <div class="project-buttons">
            <a href="${item.demo}" target="_blank" class="btn-demo">Demo</a>
            <a href="${waLink}" target="_blank" class="btn-buy">Purchase</a>
          </div>
        </div>
      </div>
    `;

    container.innerHTML += card;

  });

});
</script>

<script>
const burger = document.getElementById('burger');
const navLinks = document.getElementById('navLinks');
const overlay = document.getElementById('overlay');

burger.addEventListener('click', () => {
  navLinks.classList.toggle('active');
  overlay.classList.toggle('active');
  document.body.classList.toggle('menu-open');
});

overlay.addEventListener('click', closeMenu);

document.querySelectorAll('.nav-links a').forEach(link => {
  link.addEventListener('click', closeMenu);
});

function closeMenu(){
  navLinks.classList.remove('active');
  overlay.classList.remove('active');
  document.body.classList.remove('menu-open');
}
</script>

</body>
</html>
